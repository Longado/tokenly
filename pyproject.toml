[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tokenmeter"
version = "0.2.0"
description = "Local token usage and API-equivalent cost for Claude Code and Codex CLI"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"

[project.scripts]
tokenmeter = "tokenmeter:main"

[tool.setuptools]
py-modules = ["tokenmeter"]
