[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tokenly"
version = "0.4.0"
description = "Local token usage and API-equivalent cost for Claude Code and Codex CLI"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"

[project.scripts]
tokenly = "tokenly:main"

[tool.setuptools]
py-modules = ["tokenly"]
